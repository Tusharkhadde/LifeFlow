<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LifeFlow Copilot</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      margin: 0;
      padding: 14px;
      font-size: 13px;
      line-height: 1.45;
    }
    h1 { margin: 0 0 10px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
    h1 img { width: 20px; height: 20px; border-radius: 5px; }
    .badge { font-size: 10px; background: #4f46e5; color: #fff; border-radius: 999px; padding: 2px 6px; font-weight: 650; }
    details { margin-bottom: 10px; }
    summary { cursor: pointer; color: #4f46e5; font-weight: 650; }
    label { display: block; font-size: 11px; margin-top: 8px; opacity: 0.8; }
    input, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      border: 1px solid #8884;
      border-radius: 8px;
      background: transparent;
      color: inherit;
      font: inherit;
    }
    textarea { min-height: 64px; resize: vertical; }
    .key-row { display: flex; gap: 6px; align-items: center; }
    .key-row input { flex: 1; }
    .ghost {
      width: auto;
      padding: 8px 10px;
      background: transparent;
      color: inherit;
      border: 1px solid #8884;
      border-radius: 8px;
      cursor: pointer;
    }
    .row { display: flex; gap: 6px; margin-top: 6px; }
    button.action {
      flex: 1;
      padding: 9px 8px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 650;
      font: inherit;
    }
    button.action.secondary { background: transparent; color: #4f46e5; border: 1px solid #4f46e5; }
    button:disabled { opacity: 0.55; cursor: default; }
    #answer { margin-top: 12px; padding: 10px; border-radius: 10px; background: #4f46e51a; white-space: pre-wrap; }
    #related a { display: block; margin: 4px 0; color: #4f46e5; text-decoration: none; }
    #related small, .hint { opacity: 0.72; }
    #status { font-size: 12px; margin-top: 8px; min-height: 1.2em; }
    #status.error { color: #dc2626; }
    #status.ok { color: #15803d; }
    .page {
      font-size: 11px;
      opacity: 0.8;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hint { font-size: 11px; margin: 8px 0 0; }
  </style>
</head>
<body>
  <h1><img src="icons/icon32.png" alt="" /> LifeFlow Copilot <span class="badge">side panel</span></h1>
  <details id="settings">
    <summary>Connection</summary>
    <label for="apiUrl">App URL</label>
    <input id="apiUrl" autocomplete="url" placeholder="https://your-app.vercel.app" />
    <label for="apiKey">API key</label>
    <div class="key-row">
      <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="lf_live_… from Dashboard → Developer" />
      <button id="toggleKey" class="ghost" type="button">Show</button>
    </div>
    <div class="row">
      <button id="test" class="action secondary" type="button">Test connection</button>
    </div>
    <p class="hint">Create a key named “Chrome extension” on Dashboard → Developer. Alt+Shift+L opens this panel.</p>
  </details>

  <div class="page" id="pageInfo">Reading the current tab…</div>
  <label for="question">Question or task title</label>
  <textarea id="question" placeholder="Ask about this page, or leave empty to summarize it against your vault"></textarea>
  <div class="row">
    <button id="ask" class="action" type="button">Ask my brain</button>
    <button id="save" class="action secondary" type="button">Save page</button>
  </div>
  <div class="row">
    <button id="selection" class="action secondary" type="button">Save selection</button>
    <button id="task" class="action secondary" type="button">Task from page</button>
  </div>
  <div class="row">
    <button id="meeting" class="action secondary" type="button">Notes → tasks</button>
  </div>

  <div id="answer" hidden></div>
  <div id="related"></div>
  <div id="status" role="status"></div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
