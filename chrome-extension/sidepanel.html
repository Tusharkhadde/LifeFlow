<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 14px; font-size: 13px; line-height: 1.45; }
    h3 { margin: 0 0 10px; font-size: 15px; display: flex; align-items: center; gap: 6px; }
    .badge { font-size: 10px; background: #6366f1; color: #fff; border-radius: 999px; padding: 2px 6px; }
    details { margin-bottom: 10px; }
    summary { cursor: pointer; color: #6366f1; font-weight: 600; }
    input, textarea { width: 100%; padding: 8px; margin: 6px 0; box-sizing: border-box; border: 1px solid #8884; border-radius: 8px; background: transparent; color: inherit; }
    textarea { min-height: 56px; resize: vertical; }
    .row { display: flex; gap: 6px; }
    button { flex: 1; padding: 9px; background: #6366f1; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
    button.secondary { background: transparent; color: #6366f1; border: 1px solid #6366f1; }
    button:disabled { opacity: .6; cursor: default; }
    #answer { margin-top: 12px; padding: 10px; border-radius: 10px; background: #6366f11a; white-space: pre-wrap; }
    #related a { display: block; margin: 4px 0; color: #6366f1; text-decoration: none; }
    #related small { opacity: .7; }
    #status { font-size: 11px; opacity: .7; margin-top: 8px; }
    .page { font-size: 11px; opacity: .75; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <h3>⚡ LifeFlow Copilot <span class="badge">side panel</span></h3>
  <details id="settings">
    <summary>Connection</summary>
    <input id="apiUrl" placeholder="https://your-app.vercel.app" />
    <input id="apiKey" placeholder="API key — lf_live_… (Dashboard → Developer)" />
  </details>

  <div class="page" id="pageInfo">Reading current tab…</div>

  <textarea id="question" placeholder="Ask about this page — or leave empty to summarize + connect to your vault"></textarea>
  <div class="row">
    <button id="ask">Ask my brain</button>
    <button id="save" class="secondary">Save page</button>
  </div>
  <div class="row" style="margin-top:6px">
    <button id="task" class="secondary">Task from page</button>
    <button id="meeting" class="secondary">Notes → tasks</button>
  </div>

  <div id="answer" hidden></div>
  <div id="related"></div>
  <div id="status"></div>

  <script src="sidepanel.js"></script>
</body>
</html>
