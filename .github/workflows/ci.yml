name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lifeflow
          POSTGRES_PASSWORD: lifeflow
          POSTGRES_DB: lifeflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifeflow -d lifeflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://lifeflow:lifeflow@localhost:5432/lifeflow
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci12
      BETTER_AUTH_URL: http://127.0.0.1:3000
      INTEGRATION_OAUTH_SECRET: ci-oauth-secret-ci-oauth-secret
      TOKEN_ENCRYPTION_KEY: ci-token-key-ci-token-key-ci-token
      OPENAI_API_KEY: sk-ci
      OPENAI_BASE_URL: https://example.invalid/v1
      OPENAI_MODEL: ci-primary
      OPENAI_FAST_MODEL: ci-fast
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
